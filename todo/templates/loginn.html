{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Se connecter</title>
  <link rel="stylesheet" href="{% static 'css/index.css' %}" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Font Awesome 5 Brands:wght@400&display=swap" />
</head>

<body>
  <div class="signup-login">
    <div class="signup-box">
      <form method="POST">
        {% csrf_token %}
        <div class="heading">
          Se connecter
        </div>
        <div class="line"></div>
        <div class="field">
          <b>Nom d'utilisateur</b>
          <input type="text" required class="inp" placeholder="Entrez votre nom d'utilisateur" name="fnm">
        </div>
        <div>
          <b>Mot de passe</b>
          <input type="password" required class="inp" placeholder="Entrez votre mot de passe" name="pwd">
        </div>
        <div class="field">
          <input type="submit" class="submit-button" value="Loginn">
        </div>

      </form>
      <div class="field">
        <b style="margin-left: 130px;">Vous n'avez pas de compte ?</b>
        <br>
        <a class="anc" href="{% url 'signup' %}">S'inscrire</a>
      </div>
    </div>
  </div>
</body>

</html>
